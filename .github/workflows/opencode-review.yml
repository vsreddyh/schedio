name: opencode-review

# Automatic PR review ONLY by Muse Spark 1.3 Contributor via the OpenCode
# GitHub action (https://opencode.ai/docs/github/ - Pull Request Example).
# Trigger is pull_request only: no /oc comment commands, no issue triage,
# no schedules. Review-only: contents:read so it cannot push code; it posts
# findings as a PR comment through the issues API (hence issues:write while
# pull-requests stays read).
#
# The reviewer stages scratch files in /tmp, which is outside the
# checkout. The repo-root opencode.json explicitly allows external_directory
# /tmp/* (the CLI's matcher turns "*" into ".*", so that covers nested temp
# dirs too). Current defaults already allow external_directory, so this is
# belt-and-braces against a future default change - keep it.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# One review per PR: a new push cancels the in-flight review instead of
# stacking a full-model review per commit.
concurrency:
  group: opencode-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Fork PRs have no OPENCODE_API_KEY secret, so skip instead of failing.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run OpenCode review
        uses: anomalyco/opencode/github@733b2c627e5aec39cb33cc22373bdce33053ef2c # v1.19.0
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: opencode-go/muse-spark-1.3-contributor
          use_github_token: true
          prompt: |
            Review this pull request for behaviour-level problems, including
            docs that would make an operator run the wrong command or believe
            a false claim, and post them as a PR comment. Do not modify code,
            push commits, or create branches or PRs. If there are none, say so
            once and stop.
